name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      # electron-builder: skip code signing when no cert is configured.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Pushed tag (e.g. v0.2.0) becomes the build version; empty on manual
      # dispatch so build.sh falls back to a dated snapshot.
      SYNKBAN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0

      # Pinned in rust-toolchain.toml; installed minimally and selected via env so
      # rustup does not re-sync the file's components.
      - name: Setup Rust
        shell: bash
        run: |
          v=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('backend/Cargo.lock', 'backend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxss1 libnss3 musl-tools

      - name: Build desktop app
        shell: bash
        run: ./build.sh --desktop

      - name: List artifacts
        shell: bash
        run: ls -la electron/dist/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synkban-${{ matrix.os }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.exe
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ### ⭐️ Features

            - ...

            ### 📈 Improvements

            - ...

            ### 🐞 Bugfixes

            - ...

            ### ⚙️ Internals

            - ...

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    permissions:
      contents: read
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synkban-macos-latest
          path: artifacts

      - name: Rewrite cask and push to tap
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          v="${tag#v}"

          cask_zip="artifacts/Synkban-${tag}-mac-arm64.zip"
          cask_sha=$(sha256sum "$cask_zip" | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-synkban.git" tap
          mkdir -p tap/Casks

          cat > tap/Casks/synkban.rb <<EOF
          cask "synkban" do
            version "${v}"
            sha256 "${cask_sha}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/Synkban-v#{version}-mac-arm64.zip"
            name "Synkban"
            desc "Local-first, syncable kanban board and notes"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            depends_on arch: :arm64
            depends_on :macos

            app "Synkban.app"

            # Release builds are unsigned, so macOS Gatekeeper would refuse to open a quarantined copy.
            preflight_steps do
              run "/usr/bin/xattr",
                  args: ["-dr", "com.apple.quarantine", "{{staged_path}}/Synkban.app"]
            end

            zap trash: [
              "~/Library/Application Support/synkban",
              "~/Library/Caches/com.synkban.app",
              "~/Library/Preferences/com.synkban.app.plist",
              "~/Library/Saved Application State/com.synkban.app.savedState",
            ]
          end
          EOF

          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Cask already up to date"
            exit 0
          fi
          git add Casks/synkban.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update synkban to ${v}"
          git push

  docker:
    name: Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"
            v_clean="${v#v}"
            echo "version=${v}" >> "$GITHUB_OUTPUT"
            if [[ "$v" == *-* ]]; then
              echo "tags=${IMAGE}:${v_clean},${IMAGE}:${v}" >> "$GITHUB_OUTPUT"
            else
              echo "tags=${IMAGE}:${v_clean},${IMAGE}:${v},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            fi
          else
            v="snap-$(date -u +%Y-%m-%d)"
            echo "version=${v}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: synkban-smoke
          build-args: |
            SYNKBAN_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker image (smoke test)
        run: docker run --rm synkban-smoke --version

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SYNKBAN_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
