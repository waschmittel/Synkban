<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Synkban</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0079bf" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Synkban" />
    <!-- Respect the OS appearance before first paint to avoid a light flash.
         The persisted preference (server-side) is applied by theme.ts once it
         loads, which corrects this if the user forced light/dark. -->
    <script>
      try {
        if (matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add("theme-dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
